name: Go Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Build Bot Binary
      run: CGO_ENABLED=1 go build -v -o nova-disbot .

    - name: Run Tests
      run: CGO_ENABLED=1 go test -v ./...

    # --- ADD THIS STEP TO SAVE THE BINARY ---
    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nova-disbot-binary
        path: nova-disbot